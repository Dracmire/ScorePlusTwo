name: Experimento — puntualidad del cron

# Workflow TEMPORAL, separado de diario.yml, para aislar una variable: el
# pipeline real corre en ~30 segundos (confirmado en corridas previas), así
# que un job que tarda eso no explica un atraso de 4-5 horas. Si ESTE job
# (que no hace nada más que imprimir la hora) también se atrasa igual,
# el problema es el cron/scheduler de GitHub Actions, no el pipeline.
#
# Programado para disparar una sola vez: 2026-09-09 11:20 UTC (day=9,
# month=9 fija la fecha exacta en vez de repetir todos los días). Borrar
# este archivo después de leer el resultado en la pestaña Actions.
on:
  schedule:
    - cron: '20 11 9 9 *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    steps:
      - name: Imprimir hora real de disparo
        run: |
          echo "Programado para: 2026-09-09 11:20 UTC"
          echo "Hora real de esta corrida (UTC): $(date -u +'%Y-%m-%d %H:%M:%S')"
