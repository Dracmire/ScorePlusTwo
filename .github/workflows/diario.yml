name: Pipeline diario

on:
  schedule:
    # GitHub Actions interpreta el cron SIEMPRE en UTC — no hay forma de
    # pedirle que use hora de Chile directamente. Chile alterna entre
    # UTC-4 (hora de invierno) y UTC-3 (hora de verano) según la época del
    # año, así que un solo valor de cron cae en horas locales distintas
    # dependiendo de la temporada. '0 5 * * *' UTC da 01:00 CLT en invierno
    # y 02:00 CLT en verano — ambas dentro de la ventana 22:00–07:00 que
    # ChileCompra recomienda para consultas pesadas (SPEC §2). NO usar
    # '0 4 * * *': en invierno cae exactamente a medianoche en Chile, y el
    # programa calcula "ayer" a partir de la fecha local (America/Santiago,
    # ver Program.cs) — una corrida que dispare unos segundos antes o
    # después de esa medianoche pediría el día equivocado a la API.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha a procesar (DD-MM-YYYY). Vacío = ayer en Chile (America/Santiago).'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pipeline-diario
  cancel-in-progress: false

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar
        run: dotnet build ScorePlusTwo.sln --configuration Release

      - name: Ejecutar pipeline
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
          FECHA_INPUT: ${{ github.event.inputs.fecha }}
        run: |
          if [ -n "$FECHA_INPUT" ]; then
            dotnet run --project src/ScorePlusTwo.Pipeline --configuration Release --no-build -- --fecha "$FECHA_INPUT"
          else
            dotnet run --project src/ScorePlusTwo.Pipeline --configuration Release --no-build
          fi

      - name: Commit y push de resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/adjudicadas data/candidatas.json data/informes.json data/eventos.json docs/data.json
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
          else
            git commit -m "chore: actualización diaria del pipeline $(date -u +%F)"
            git push
          fi
