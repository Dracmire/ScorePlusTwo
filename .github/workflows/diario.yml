name: Pipeline diario

on:
  schedule:
    # GitHub Actions interpreta el cron SIEMPRE en UTC — no hay forma de
    # pedirle que use hora de Chile directamente. Chile alterna entre
    # UTC-4 (hora de invierno) y UTC-3 (hora de verano) según la época del
    # año, así que un solo valor de cron cae en horas locales distintas
    # dependiendo de la temporada.
    #
    # Retraso del scheduler de GitHub Actions, medido en SIETE mediciones
    # independientes (2026-09-05 a 2026-09-10: seis corridas reales del
    # pipeline con distintos crons, más un experimento con un job trivial
    # sin checkout/build/dependencia propia, que descarta que el atraso sea
    # nuestro):
    #   3h25, 4h58, 4h23, 4h52, 4h51, 3h47 (experimento), 1h52
    # Rango: **1h52 a 4h58**. Sin relación con el minuto de disparo elegido
    # (crons distintos, atrasos comparables) ni con si es en punto o no —
    # es atraso de la plataforma. Es intencionalmente ancho (piso muy por
    # debajo del techo) y hay que diseñar el horario asumiendo cualquier
    # valor dentro de ese rango, no un promedio.
    #
    # Cron: campos en orden minuto-hora-día-mes-día_semana (este valor se
    # leyó mal una vez — '23 3 * * *' — precisamente por no tenerlo claro).
    #
    # Diseño del horario — por qué la medianoche NO es el problema que
    # parecía: versiones anteriores de este comentario intentaban, primero,
    # que la LLEGADA aterrizara justo en el borde de la ventana 22:00–07:00
    # de ChileCompra (falló: con atraso real de 1h52 la llegada quedó horas
    # antes de que abriera la ventana), y después, que el DISPARO evitara
    # cruzar la medianoche chilena de forma inconsistente entre días (para
    # no arriesgar que "ayer" saltara un día calendario completo). Esa
    # segunda preocupación resultó estar mal aplicada a este dominio: el
    # día hábil de los organismos públicos cierra entre las 18 y 19 horas,
    # y desde ahí hasta que reabren al día siguiente NO se publican
    # licitaciones nuevas. Todo ese bloque nocturno corresponde al MISMO
    # día de licitaciones sin importar si la muestra se toma a las 22:00,
    # la 01:00 o las 06:00 — la medianoche del reloj no es un corte real de
    # datos en este dominio, a diferencia de qué día calendario le pone
    # AhoraChile() a la corrida. El contenido que devuelve la API es
    # idéntico tome la muestra cuando la tome dentro de ese bloque, así que
    # no hay corrida que pueda "perderse" un día por cruzar o no cruzar
    # medianoche.
    #
    # Con eso resuelto, el objetivo vuelve a ser simple: disparar cerca de
    # las 21:00 hora de Chile, para que con el atraso típico (mayoría del
    # rango entre 3h y 5h) la corrida aterrice después de las 22:00. Un
    # atraso mínimo (1h52) la deja un poco antes de las 22:00, pero sigue
    # muy adentro del bloque nocturno sin publicaciones nuevas, así que no
    # es un problema real.
    #
    # '0 0 * * *' (medianoche UTC) da un solo valor de cron para las dos
    # temporadas:
    #   - Verano (Chile UTC-3): dispara a las 21:00 CLT. Con el rango de
    #     atraso 1h52–4h58 llega entre las 22:52 y la 01:58 del día
    #     siguiente.
    #   - Invierno (Chile UTC-4): dispara a las 20:00 CLT. Llega entre las
    #     21:52 y las 00:58.
    # AhoraChile() no necesita ningún cambio: sigue calculando "ayer"
    # convirtiendo a la hora real de Chile antes de restar un día, y sigue
    # siendo correcto por construcción para cualquier hora de disparo. Cuál
    # de los dos días calendario adyacentes le toque a una corrida puntual
    # ya no importa para la integridad del histórico, porque ambos días
    # calendario caen dentro del mismo bloque sin licitaciones nuevas.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha a procesar (DD-MM-YYYY). Vacío = ayer en Chile (America/Santiago).'
        required: false
        type: string
      backfill_unspsc:
        description: 'true = correr --backfill-unspsc (reclasifica Prioritarias existentes vía UNSPSC) en vez del flujo normal. Ignora "fecha".'
        required: false
        type: boolean
        default: false
      reevaluar_inventario:
        description: 'true = correr --reevaluar-inventario (revalida Estado y reclasifica Prioritarias + Tramo bajo con las reglas actuales) en vez del flujo normal. Ignora "fecha" y "backfill_unspsc".'
        required: false
        type: boolean
        default: false
      consultar_licitacion:
        description: 'Código externo a consultar (ej. 734-50-LE26): corre --consultar-licitacion <codigo> en vez del flujo normal, escribe data/consultas/{codigo}.json. Ignora "fecha", "backfill_unspsc" y "reevaluar_inventario".'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: pipeline-diario
  cancel-in-progress: false

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar
        run: dotnet build ScorePlusTwo.sln --configuration Release

      - name: Ejecutar pipeline
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
          FECHA_INPUT: ${{ github.event.inputs.fecha }}
          BACKFILL_UNSPSC: ${{ github.event.inputs.backfill_unspsc }}
          REEVALUAR_INVENTARIO: ${{ github.event.inputs.reevaluar_inventario }}
          CONSULTAR_LICITACION: ${{ github.event.inputs.consultar_licitacion }}
        run: |
          if [ -n "$CONSULTAR_LICITACION" ]; then
            dotnet run --project src/ScorePlusTwo.Pipeline --configuration Release --no-build -- --consultar-licitacion "$CONSULTAR_LICITACION"
          elif [ "$REEVALUAR_INVENTARIO" = "true" ]; then
            dotnet run --project src/ScorePlusTwo.Pipeline --configuration Release --no-build -- --reevaluar-inventario
          elif [ "$BACKFILL_UNSPSC" = "true" ]; then
            dotnet run --project src/ScorePlusTwo.Pipeline --configuration Release --no-build -- --backfill-unspsc
          elif [ -n "$FECHA_INPUT" ]; then
            dotnet run --project src/ScorePlusTwo.Pipeline --configuration Release --no-build -- --fecha "$FECHA_INPUT"
          else
            dotnet run --project src/ScorePlusTwo.Pipeline --configuration Release --no-build
          fi

      - name: Commit y push de resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data/cache-unspsc.json faltaba acá desde que se implementó el
          # enriquecimiento (PR #27, 2026-09-17): el runner es efímero, así
          # que el cache que Program.cs escribe a disco durante la corrida
          # nunca sobrevivía entre corridas — cada día se reenriquecían desde
          # cero los mismos códigos ya enriquecidos el día anterior. Mismo
          # modo de falla que ya pasó con secundarias.json/tramo_bajo.json
          # cuando esas listas se crearon (2026-09-16).
          git add data/raw data/adjudicadas data/candidatas.json data/secundarias.json data/tramo_bajo.json data/cache-unspsc.json data/historico data/informes.json data/eventos.json data/consultas docs/data.json
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
          else
            git commit -m "chore: actualización diaria del pipeline $(date -u +%F)"
            git push
          fi
