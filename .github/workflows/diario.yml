name: Pipeline diario

on:
  schedule:
    # GitHub Actions interpreta el cron SIEMPRE en UTC — no hay forma de
    # pedirle que use hora de Chile directamente. Chile alterna entre
    # UTC-4 (hora de invierno) y UTC-3 (hora de verano) según la época del
    # año, así que un solo valor de cron cae en horas locales distintas
    # dependiendo de la temporada.
    #
    # Se cambió de '0 5 * * *' a '23 3 * * *' por evidencia real de retraso,
    # no preventivamente: las tres corridas 'schedule' que existieron hasta
    # ahora dispararon con 3-5 horas de atraso, con DOS valores de cron
    # distintos (ambos en punto):
    #   - '0 9 * * *'  -> disparó a las 12:25 UTC (3h25 tarde)
    #   - '0 5 * * *'  -> disparó a las 09:58 UTC (4h58 tarde)
    #   - '0 5 * * *'  -> disparó a las 09:23 UTC (4h23 tarde)
    # La variable común entre los tres es el minuto en punto (":00"), que
    # GitHub documenta como la hora de mayor congestión de encolamiento de
    # Actions. Con retrasos de hasta ~5h la corrida se salía de la ventana
    # 22:00–07:00 que recomienda ChileCompra (una de las tres llegó a las
    # 06:23 CLT, dentro por muy poco). '23 3 * * *' saca el disparo de la
    # marca en punto para reducir ese encolamiento.
    #
    # Verificado con el mismo tzdata que usa TimeZoneInfo en Linux
    # (America/Santiago): a las 03:23 UTC,
    #   - en horario de VERANO (UTC-3) son las 00:23 CLT del MISMO día UTC
    #     -> deja ~7h de margen antes de las 07:00, dentro de la ventana.
    #   - en horario de INVIERNO (UTC-4) son las 23:23 CLT del día ANTERIOR
    #     -> dentro de la ventana por el otro extremo.
    # Esto último tiene una consecuencia en el cálculo de "ayer": en verano,
    # "hoy" en Chile coincide con el día UTC del disparo y "ayer" es el día
    # UTC anterior (el caso normal); en invierno, "hoy" en Chile es un día
    # ANTES del día UTC del disparo, así que "ayer" termina siendo el
    # ANTEPENÚLTIMO día UTC, no el previo. Program.cs ya cubre esto
    # correctamente porque AhoraChile() convierte a la hora real de Chile
    # ANTES de restar un día — nunca asume que el día UTC y el día CLT
    # coinciden — así que ningún cambio de código fue necesario, solo esta
    # constancia explícita para que quede documentado por qué es seguro.
    #
    # Retraso del scheduler, medido empíricamente (2026-09-09): un workflow
    # de un solo job trivial (imprimir la hora, sin checkout ni build) se
    # programó para las 11:20 UTC. El log del propio run (run_started_at,
    # UTC) dice que corrió a las ~15:07 UTC — 3h47 tarde, sin ninguna
    # dependencia propia que lo explique. (Ojo con la fuente: la pestaña
    # Actions lista los runs en hora LOCAL de Chile, no UTC — leer esa
    # columna en vez del log del run fue justo lo que hizo que esta nota
    # dijera "47 minutos" en una versión anterior.) Ese 3h47 encaja dentro
    # del rango ya documentado arriba (3h25, 4h58, 4h23) en vez de
    # contradecirlo: el rango de atraso del scheduler de GitHub Actions es
    # de **3h25 a 4h58**. Es retraso de la plataforma, no de este pipeline
    # ni de su minuto de disparo (el experimento usó minuto 20, el pipeline
    # minuto 23 el mismo día, con retrasos comparables) — no hace falta
    # seguir persiguiéndolo.
    #
    # Cron: campos en orden minuto-hora-día-mes-día_semana. '0 21 * * *' es
    # minuto 0, hora 21 UTC — se eligió (no es el valor anterior, '23 3 * *
    # *', que apuntaba a la madrugada) para que la corrida llegue cerca de
    # las 22:00 hora de Chile, el borde TEMPRANO de la ventana 22:00–07:00
    # que recomienda ChileCompra, en vez de la madrugada:
    #   - Verano (UTC-3): dispara a las 18:00 CLT: con el rango de atraso
    #     3h25–4h58 llega entre las 21:25 y las 22:58 CLT.
    #   - Invierno (UTC-4): dispara a las 17:00 CLT; llega entre las 20:25
    #     y las 21:58 CLT.
    # Con el peor atraso observado (4h58) la ejecución real termina a las
    # 22:58 CLT (verano) o 21:58 CLT (invierno) — en ambos casos ANTES de
    # medianoche, sin cruzar al día calendario siguiente. Como la ejecución
    # cae el mismo día calendario chileno en que se disparó el cron (a
    # diferencia de '23 3 * * *', cuyo disparo mismo caía cerca de
    # medianoche), "ayer" se calcula sobre el día correcto sin el riesgo de
    # desfase que motivó la verificación explícita de arriba. AhoraChile()
    # sigue sin necesitar cambios: convierte a hora real de Chile ANTES de
    # restar un día, así que es correcto para cualquier hora de disparo por
    # construcción, no algo específico de este cron.
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha a procesar (DD-MM-YYYY). Vacío = ayer en Chile (America/Santiago).'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pipeline-diario
  cancel-in-progress: false

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar
        run: dotnet build ScorePlusTwo.sln --configuration Release

      - name: Ejecutar pipeline
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
          FECHA_INPUT: ${{ github.event.inputs.fecha }}
        run: |
          if [ -n "$FECHA_INPUT" ]; then
            dotnet run --project src/ScorePlusTwo.Pipeline --configuration Release --no-build -- --fecha "$FECHA_INPUT"
          else
            dotnet run --project src/ScorePlusTwo.Pipeline --configuration Release --no-build
          fi

      - name: Commit y push de resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/adjudicadas data/candidatas.json data/secundarias.json data/tramo_bajo.json data/historico data/informes.json data/eventos.json docs/data.json
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
          else
            git commit -m "chore: actualización diaria del pipeline $(date -u +%F)"
            git push
          fi
