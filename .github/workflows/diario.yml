name: Pipeline diario

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC = 06:00 CLT (hora de invierno) / 05:00 CLT (hora de verano)
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha a procesar (DD-MM-YYYY). Vacío = ayer (UTC).'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pipeline-diario
  cancel-in-progress: false

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar
        run: dotnet build ScorePlusTwo.sln --configuration Release

      - name: Ejecutar pipeline
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
          FECHA_INPUT: ${{ github.event.inputs.fecha }}
        run: |
          if [ -n "$FECHA_INPUT" ]; then
            dotnet run --project src/ScorePlusTwo.Pipeline --configuration Release --no-build -- --fecha "$FECHA_INPUT"
          else
            dotnet run --project src/ScorePlusTwo.Pipeline --configuration Release --no-build
          fi

      - name: Commit y push de resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/adjudicadas data/candidatas.json data/informes.json data/eventos.json docs/data.json
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
          else
            git commit -m "chore: actualización diaria del pipeline $(date -u +%F)"
            git push
          fi
