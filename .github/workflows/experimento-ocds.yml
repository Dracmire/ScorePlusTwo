name: Experimento — datos abiertos OCDS

# Temporal (ver plan de sesión, "Investigación — rediseño de la etapa 3 con
# UNSPSC"): evalúa si el archivo mensual de datos abiertos de ChileCompra
# (datos-abiertos.chilecompra.cl, estándar OCDS, sin ticket) sirve para
# sembrar el cache UNSPSC con una descarga en vez de miles de llamadas de
# detalle. Público, sin secrets — no necesita MP_TICKET. No toca el código
# del pipeline ni sus datos. Borrar este archivo una vez leído el
# resultado, mismo ciclo de vida que experimento-cron.yml/
# experimento-unspsc.yml.
#
# La corrida #1 confirmó que la página de descargas es una SPA de React
# sin links estáticos en el HTML. La corrida #2 probó
# https://ocds.blob.core.windows.net/ocds/{yyyymm}.zip (patrón encontrado
# por búsqueda) para el mes en curso y el anterior — ambos 404. Las
# búsquedas posteriores dieron respuestas contradictorias sobre el
# contenedor/dominio/formato de fecha exactos (posible eco de la propia
# consulta, no un hecho verificado), así que en vez de seguir adivinando
# por búsqueda, este paso extrae la URL real del bundle JS de la SPA
# (grep directo sobre el código que efectivamente construye los links de
# descarga) y, en paralelo, prueba una lista de candidatos ya vistos en
# distintas fuentes como respaldo si el grep del bundle no encuentra nada
# útil.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  experimento:
    runs-on: ubuntu-latest
    steps:
      - name: Extraer URLs candidatas del bundle JS de la SPA
        run: |
          set -x
          curl -sSL "https://datos-abiertos.chilecompra.cl/descargas/procesos-ocds" -o pagina.html
          echo "--- pagina.html ---"
          cat pagina.html

          JS_PATH=$(grep -oE '/static/js/main\.[a-f0-9]+\.js' pagina.html | head -1)
          echo "JS_PATH detectado: $JS_PATH"

          > candidatos.txt
          if [ -n "$JS_PATH" ]; then
            curl -sSL "https://datos-abiertos.chilecompra.cl${JS_PATH}" -o bundle.js
            echo "Tamaño del bundle:"
            wc -c bundle.js

            echo "=== Referencias a blob storage en el bundle ==="
            grep -oE '[a-zA-Z0-9.-]*blob\.core\.windows\.net/[a-zA-Z0-9._/-]*' bundle.js | sort -u | tee -a candidatos_base.txt || echo "sin matches de blob"

            echo "=== Referencias a .zip en el bundle ==="
            grep -oE '[a-zA-Z0-9:/._-]*\.zip[a-zA-Z0-9._-]*' bundle.js | sort -u | head -50 || echo "sin matches de .zip"

            echo "=== Contexto alrededor de 'blob' en el bundle (primeras 5 ocurrencias) ==="
            grep -oE '.{80}blob\.core\.windows\.net.{80}' bundle.js | head -5 || echo "sin contexto"
          else
            echo "No se detectó ruta de bundle JS en el HTML — revisar pagina.html arriba."
          fi

          # Candidatos manuales ya vistos en distintas fuentes (container/
          # dominio/formato de fecha no confirmados de forma independiente,
          # se prueban todos por descarte):
          MES_PAD=$(date -u +%Y%m)
          MES_ANTERIOR_PAD=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y%m)
          ANIO=$(date -u +%Y)
          MES_NUM=$(date -u +%-m)
          MES_ANTERIOR_ANIO=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y)
          MES_ANTERIOR_NUM=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%-m)

          cat >> candidatos.txt <<CANDIDATOS
          https://ocds.blob.core.windows.net/ocds/${MES_PAD}.zip
          https://ocds.blob.core.windows.net/ocds/${MES_ANTERIOR_PAD}.zip
          https://ocds.blob.core.windows.net/ocds/${ANIO}-${MES_NUM}.zip
          https://ocds.blob.core.windows.net/ocds/${MES_ANTERIOR_ANIO}-${MES_ANTERIOR_NUM}.zip
          https://transparenciachc.blob.core.windows.net/ocds/${ANIO}-${MES_NUM}.zip
          https://transparenciachc.blob.core.windows.net/ocds/${MES_ANTERIOR_ANIO}-${MES_ANTERIOR_NUM}.zip
          CANDIDATOS

          if [ -f candidatos_base.txt ]; then
            cat candidatos_base.txt >> candidatos.txt
          fi

          echo "=== Candidatos finales a probar ==="
          cat candidatos.txt

      - name: Probar cada candidato hasta lograr una descarga real
        run: |
          set -x
          DESCARGADO=""
          while read -r url; do
            [ -z "$url" ] && continue
            echo "Probando: $url"
            if curl -sSL -f -o candidato "$url"; then
              TAM=$(stat -c%s candidato 2>/dev/null || echo 0)
              echo "Respondió 200 desde: $url (tamaño: $TAM bytes)"
              # Un 200 con cuerpo HTML de error genérico no cuenta como éxito real.
              if [ "$TAM" -gt 1000 ] && ! head -c 200 candidato | grep -qi "<!doctype\|<html"; then
                echo "Descarga real confirmada: $url"
                echo "$url" > url_exitosa.txt
                DESCARGADO="1"
                break
              else
                echo "Descartado (parece HTML de error o archivo vacío), sigo probando."
              fi
            else
              echo "Falló: $url"
            fi
          done < candidatos.txt

          if [ -n "$DESCARGADO" ]; then
            echo "1" > descarga_ok.txt
          else
            echo "NINGÚN CANDIDATO FUNCIONÓ — revisar el log del paso anterior (bundle.js/pagina.html) manualmente."
          fi

      - name: Descomprimir el archivo descargado
        run: |
          set -x
          if [ ! -f descarga_ok.txt ]; then
            echo "NO SE PUDO DESCARGAR NINGÚN ARCHIVO — revisar pagina.html volcada en el paso anterior."
            exit 0
          fi

          echo "=== Tipo de archivo descargado ==="
          file candidato
          ls -la candidato

          mkdir -p datos
          if file candidato | grep -qi zip; then
            unzip -o candidato -d datos
          else
            cp candidato datos/archivo.json
          fi
          echo "=== Contenido descomprimido ==="
          ls -la datos
          du -sh datos/* || true

      - name: Inspeccionar estructura del JSON
        run: |
          python3 - <<'EOF'
          import json, glob, os

          archivos = sorted(glob.glob('datos/**/*.json', recursive=True))
          if not archivos:
              print("No se encontró ningún .json descomprimido — revisar pasos anteriores.")
              raise SystemExit(0)

          total_bytes = sum(os.path.getsize(a) for a in archivos)
          print(f"Cantidad de archivos .json en el ZIP: {len(archivos)}")
          print(f"Tamaño total descomprimido: {total_bytes / 1024 / 1024:.2f} MB")

          releases = []

          if len(archivos) > 5:
              # Caso "un archivo por proceso" (así lo describe la documentación
              # de ChileCompra) — cada archivo puede venir como {"releases":[...]},
              # {"compiledRelease": {...}}, un release suelto, o una lista.
              print("Formato: múltiples archivos, uno por proceso — muestreando hasta 2000")
              for a in archivos[:2000]:
                  with open(a, encoding='utf-8') as f:
                      d = json.load(f)
                  if isinstance(d, dict) and 'releases' in d:
                      releases.extend(d['releases'])
                  elif isinstance(d, dict) and 'compiledRelease' in d:
                      releases.append(d['compiledRelease'])
                  elif isinstance(d, dict) and 'tender' in d:
                      releases.append(d)
                  elif isinstance(d, list):
                      releases.extend(d)
          else:
              # Caso archivo único: JSON Lines o un JSON con "releases": [...]
              archivo = archivos[0]
              print(f"Formato: archivo único — {archivo}")
              with open(archivo, encoding='utf-8') as f:
                  primera_linea = f.readline()
              try:
                  data = json.loads(primera_linea)
                  es_jsonl = True
              except json.JSONDecodeError:
                  es_jsonl = False

              if es_jsonl:
                  print("Sub-formato: JSON Lines (un release por línea)")
                  releases = [data]
                  with open(archivo, encoding='utf-8') as f:
                      for i, linea in enumerate(f):
                          if i == 0:
                              continue
                          if i > 2000:
                              break
                          releases.append(json.loads(linea))
              else:
                  with open(archivo, encoding='utf-8') as f:
                      data = json.load(f)
                  if isinstance(data, dict) and 'releases' in data:
                      releases = data['releases']
                      print(f"Sub-formato: JSON único con clave 'releases', {len(releases)} releases totales")
                  elif isinstance(data, list):
                      releases = data
                      print(f"Sub-formato: lista JSON de {len(releases)} elementos")
                  else:
                      print("Formato inesperado, claves de nivel superior:", list(data.keys()) if isinstance(data, dict) else type(data))

          print(f"\nProcesos inspeccionados (muestra): {len(releases)}")

          if releases:
              primero = releases[0]
              print("\n=== Claves de nivel superior del primer release ===")
              print(list(primero.keys()))

              tender = primero.get('tender', {})
              print("\n=== Claves de 'tender' ===")
              print(list(tender.keys()))

              items = tender.get('items', [])
              print(f"\n=== 'tender.items' — cantidad: {len(items)} ===")
              if items:
                  print("Primer item completo:")
                  print(json.dumps(items[0], indent=2, ensure_ascii=False))
              else:
                  print("tender.items está vacío o no existe en este release.")

              print("\n=== tender.status del primer release ===")
              print(tender.get('status'))

              from collections import Counter
              estados = Counter()
              con_items = 0
              for r in releases:
                  t = r.get('tender', {})
                  estados[t.get('status')] += 1
                  if t.get('items'):
                      con_items += 1

              print(f"\n=== Distribución de tender.status en la muestra ({len(releases)} releases) ===")
              for estado, cnt in estados.most_common():
                  print(f"  {estado}: {cnt}")

              print(f"\n=== Releases con items no vacíos: {con_items}/{len(releases)} ===")
          EOF
