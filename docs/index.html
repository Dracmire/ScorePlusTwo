<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Licitaciones — Candidatas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="contenedor">
    <header>
      <h1>Candidatas de Mercado Público</h1>
      <p id="generado-en">Cargando…</p>
    </header>

    <section class="panel">
      <div class="panel-header">
        <div class="tabs" id="tabs" role="tablist">
          <button class="tab tab-activa" data-tab="prioritarias" role="tab" aria-selected="true">Prioritarias</button>
          <button class="tab" data-tab="secundarias" role="tab" aria-selected="false">Secundarias</button>
          <button class="tab" data-tab="tramo_bajo" role="tab" aria-selected="false">Tramo bajo</button>
        </div>
        <button id="btn-descargar-csv" class="boton-secundario" hidden>Descargar CSV</button>
      </div>
      <div id="tabla-candidatas"></div>
    </section>

    <section class="panel" id="panel-grafico">
      <h2>Tasa de rubro prioritario por día</h2>
      <div id="grafico-serie"></div>
    </section>

    <footer>
      Tablero de solo lectura — F1 (MVP). El triage se hace editando
      <code>data/candidatas.json</code> (Prioritarias) o
      <code>data/secundarias.json</code> (Secundarias) en el repo.
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
